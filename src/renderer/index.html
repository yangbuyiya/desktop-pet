<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPet</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <section id="pet" class="pet" aria-label="TaskPet 桌宠">
        <div id="sprite" class="sprite"></div>
        <div id="fallback" class="fallback">
          <div class="bot-head">
            <span></span>
            <span></span>
          </div>
          <div class="bot-body"></div>
        </div>
      </section>
      <button id="resizeHandle" class="resize-handle" type="button" aria-label="缩放桌面宠物">
        <img class="resize-icon" src="./resize-handle.svg" alt="" aria-hidden="true" />
      </button>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
