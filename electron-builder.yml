appId: com.taskpet.shell
productName: TaskPet
copyright: Copyright © 2026 TaskPet contributors
icon: src/assets/logo.png

directories:
  output: dist

files:
  - src/**
  - package.json
  - LICENSE
  - README.md
  - README.zh-CN.md
  - '!**/.DS_Store'
  - '!**/*.map'
  - '!**/test/**'
  - '!**/.github/**'
  - '!scripts/**'

asar: true

win:
  executableName: TaskPet
  # P0 produces an unsigned shell build. Enable resource editing/signing with the
  # TaskPet release certificate when the formal release pipeline is established.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: TaskPet
  uninstallDisplayName: TaskPet
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  extendInfo:
    LSUIElement: true
  target:
    - dmg
    - zip
  artifactName: TaskPet-${version}-${platform}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

npmRebuild: false
